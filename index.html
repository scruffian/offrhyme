<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a1a1a">
    <meta name="description" content="Find perfect rhymes for any word using phonetic matching">
    <link rel="manifest" href="/manifest.json">
    <title>offrhyme - Find rhymes offline</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            background: #1a1a1a;
            min-height: 100vh;
            padding: 20px;
            color: #ffffff;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid #333;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
            font-family: 'Courier New', monospace;
        }

        h2, h3 {
            font-family: 'Courier New', monospace;
        }

        .subtitle {
            font-size: 1rem;
            color: #999;
        }

        .nav-links {
            margin-top: 20px;
        }

        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            padding: 8px 16px;
            border: 1px solid #444;
            background: #222;
            transition: all 0.2s ease;
            font-size: 0.9rem;
            display: inline-block;
        }

        .nav-links a:hover {
            background: #333;
            border-color: #666;
        }

        .search-section {
            background: #222;
            border: 1px solid #333;
            padding: 30px;
            margin-bottom: 30px;
        }

        form {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            font-size: 1rem;
            border: 1px solid #444;
            background: #1a1a1a;
            color: #ffffff;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            outline: none;
        }

        input[type="text"]::placeholder {
            color: #666;
        }

        input[type="text"]:focus {
            border-color: #666;
            background: #222;
        }

        button {
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            background: #ffffff;
            color: #000;
            border: 1px solid #ffffff;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
        }

        button:hover {
            background: #000;
            color: #ffffff;
        }

        .legend {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #333;
            font-size: 0.85rem;
            color: #999;
        }

        .legend-title {
            font-weight: 600;
            margin-bottom: 10px;
            color: #fff;
        }

        .legend-items {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .legend-color {
            width: 16px;
            height: 16px;
            border: 1px solid #666;
        }

        .results {
            background: #222;
            border: 1px solid #333;
            padding: 30px;
            display: none;
        }

        .results.show {
            display: block;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .rhyme-section {
            margin-bottom: 30px;
        }

        .rhyme-section:last-child {
            margin-bottom: 0;
        }

        .rhyme-section h3 {
            color: #ffffff;
            font-size: 1.1rem;
            margin-bottom: 15px;
            font-weight: 600;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }

        .section-divider {
            height: 1px;
            background: #333;
            margin: 30px 0;
        }

        #result {
            font-size: 0.95rem;
            word-wrap: break-word;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: flex-start;
        }

        .rhyme-word {
            padding: 8px 14px;
            border: 1px solid;
            border-bottom-width: 1px;
            transition: all 0.2s ease;
            font-weight: 400;
            font-size: 0.9rem;
        }

        .rhyme-word:hover {
            transform: translateY(-1px);
        }

        /* Popularity color tiers - subtle grayscale */
        .popularity-very-high {
            background: #ffffff;
            color: #000;
            border-color: #ffffff;
            font-weight: 600;
        }

        .popularity-high {
            background: #e0e0e0;
            color: #000;
            border-color: #e0e0e0;
            font-weight: 500;
        }

        .popularity-medium {
            background: #999;
            color: #fff;
            border-color: #999;
        }

        .popularity-low {
            background: #666;
            color: #fff;
            border-color: #666;
        }

        .popularity-very-low {
            background: transparent;
            color: #ccc;
            border-color: #666;
        }

        .popularity-rare {
            background: transparent;
            color: #888;
            border-color: #444;
        }

        .empty-state {
            text-align: center;
            color: #999;
            font-style: italic;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .search-section, .results {
                padding: 20px;
            }

            form {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>offrhyme</h1>
            <p class="subtitle">Find rhymes offline</p>
            <div class="nav-links">
                <a href="spoons.html">Spoonerizer</a>
            </div>
        </header>

        <div class="search-section">
            <form onsubmit="displayRhymes(); return false;">
                <input
                    type="text"
                    id="word"
                    placeholder="Enter a word..."
                    autocomplete="off"
                    required
                />
                <button type="submit">Search</button>
            </form>
            <div class="legend">
                <div class="legend-title">Perfect rhymes: Color = frequency</div>
                <div class="legend-items">
                    <div class="legend-item">
                        <div class="legend-color" style="background: #ffffff;"></div>
                        <span>Very common</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #e0e0e0;"></div>
                        <span>Common</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #999;"></div>
                        <span>Medium</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #666;"></div>
                        <span>Less common</span>
                    </div>
                </div>
                <div class="legend-title" style="margin-top: 15px;">Near rhymes: Color = similarity (dynamic), Opacity = frequency</div>
                <div class="legend-items">
                    <div class="legend-item">
                        <div class="legend-color" style="background: rgb(0, 200, 150);"></div>
                        <span>Best match</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: rgb(0, 160, 200);"></div>
                        <span>↓</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: rgb(0, 100, 240);"></div>
                        <span>↓</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: rgb(100, 50, 230);"></div>
                        <span>↓</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: rgb(180, 0, 200);"></div>
                        <span>Worst match</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="results" id="results-container">
            <div id="result"></div>
        </div>
    </div>

    <script src="words.js"></script>
    <script src="top-fifty.js"></script>
    <script>
        // Create a word rank lookup for fast sorting
        const wordRank = {};
        topFifty.forEach((word, index) => {
            wordRank[word] = index;
        });

        // Extract rhyming part from the last stressed vowel onwards
        function getRhymingPart( phoneticStr ) {
            if (!phoneticStr) return '';
            const phonemes = phoneticStr.split(' ');

            // Find the last phoneme with primary stress (ending in '1')
            let lastStressedIndex = -1;
            for (let i = phonemes.length - 1; i >= 0; i--) {
                if (phonemes[i].match(/1$/)) {
                    lastStressedIndex = i;
                    break;
                }
            }

            // If no primary stress found, fall back to old behavior
            if (lastStressedIndex === -1) {
                return phoneticStr.substring(phoneticStr.indexOf(" ") + 1, phoneticStr.length);
            }

            // Return everything from the last stressed vowel onwards
            return phonemes.slice(lastStressedIndex).join(' ');
        }

        const rhymes = {};
        Object.keys( words ).forEach( word => {
            const rhymingPart = getRhymingPart( words[ word ] );
            if ( ! rhymes[ rhymingPart ] ) {
                rhymes[ rhymingPart ] = [];
            }
            rhymes[ rhymingPart ].push( word );
        } );
        function getRhymes( word ) {
            const rhyme = getRhymingPart( words[ word ] );
            return rhymes[ rhyme ];
        }

        function calculateSimilarity(phonetic1, phonetic2) {
            const p1 = phonetic1.split(' ');
            const p2 = phonetic2.split(' ');

            // Count matching phonemes from the end
            let matchingFromEnd = 0;
            for (let i = 1; i <= Math.min(p1.length, p2.length); i++) {
                const ph1 = p1[p1.length - i].replace(/[012]/g, '');
                const ph2 = p2[p2.length - i].replace(/[012]/g, '');
                if (ph1 === ph2) {
                    matchingFromEnd++;
                } else {
                    break;
                }
            }

            // Penalize length difference
            const lengthDiff = Math.abs(p1.length - p2.length);

            // Higher score = more similar
            return matchingFromEnd * 10 - lengthDiff;
        }

        function getNearRhymes( word ) {
            const phonetic = words[ word ];
            if (!phonetic) return [];

            const rhymePart = getRhymingPart(phonetic);
            if (!rhymePart) return [];

            const nearRhymesWithScores = [];
            const perfectRhymes = getRhymes(word) || [];

            // Strategy: Look for rhyme patterns that differ slightly
            // Look through existing rhyme groups for similar patterns
            Object.keys(rhymes).forEach(rhymePattern => {
                // Skip if it's an exact match
                if (rhymePattern === rhymePart) return;

                // Check if patterns are similar (share ending or differ by one phoneme)
                const targetPhonemes = rhymePart.split(' ');
                const patternPhonemes = rhymePattern.split(' ');

                // Similar if they share the last phoneme (ignoring stress)
                const targetLast = targetPhonemes[targetPhonemes.length - 1].replace(/[012]/g, '');
                const patternLast = patternPhonemes[patternPhonemes.length - 1].replace(/[012]/g, '');

                if (targetLast === patternLast && targetPhonemes.length === patternPhonemes.length) {
                    // Add words from this rhyme group with similarity scores
                    rhymes[rhymePattern].slice(0, 30).forEach(w => {
                        if (w !== word && !perfectRhymes.includes(w)) {
                            const similarity = calculateSimilarity(phonetic, words[w]);
                            nearRhymesWithScores.push({ word: w, similarity });
                        }
                    });
                }
            });

            // Sort by similarity (highest first), then by frequency within each similarity level
            return nearRhymesWithScores
                .sort((a, b) => {
                    // Primary sort: similarity (descending)
                    if (a.similarity !== b.similarity) {
                        return b.similarity - a.similarity;
                    }
                    // Secondary sort: frequency (ascending rank = more common first)
                    const rankA = wordRank[a.word] !== undefined ? wordRank[a.word] : 999999;
                    const rankB = wordRank[b.word] !== undefined ? wordRank[b.word] : 999999;
                    return rankA - rankB;
                });
        }

        function getPopularityClass(rank) {
            if (rank < 1000) return 'popularity-very-high';
            if (rank < 5000) return 'popularity-high';
            if (rank < 15000) return 'popularity-medium';
            if (rank < 30000) return 'popularity-low';
            if (rank < 50000) return 'popularity-very-low';
            return 'popularity-rare';
        }

        function renderRhymeWords(wordList) {
            return wordList.map(word => {
                const rank = wordRank[word] !== undefined ? wordRank[word] : 999999;
                const popularityClass = getPopularityClass(rank);
                return `<div class="rhyme-word ${popularityClass}">${word}</div>`;
            }).join('');
        }

        function getSimilarityColor(similarity, minSim, maxSim) {
            // Smooth continuous gradient: green → teal → cyan → blue → indigo → purple
            // Each score gets a unique color

            // Normalize similarity to 0-1 range based on actual min/max
            const range = maxSim - minSim;
            const t = range > 0 ? (similarity - minSim) / range : 1;

            // Define 5 color stops for smooth interpolation
            const colorStops = [
                { pos: 1.0, r: 0, g: 200, b: 150 },     // Teal (best near rhyme)
                { pos: 0.75, r: 0, g: 160, b: 200 },    // Cyan
                { pos: 0.5, r: 0, g: 100, b: 240 },     // Blue
                { pos: 0.25, r: 100, g: 50, b: 230 },   // Indigo
                { pos: 0.0, r: 180, g: 0, b: 200 }      // Purple (worst)
            ];

            // Find the two color stops to interpolate between
            let lowerStop = colorStops[colorStops.length - 1];
            let upperStop = colorStops[0];

            for (let i = 0; i < colorStops.length - 1; i++) {
                if (t >= colorStops[i + 1].pos && t <= colorStops[i].pos) {
                    upperStop = colorStops[i];
                    lowerStop = colorStops[i + 1];
                    break;
                }
            }

            // Interpolate between the two stops
            const segmentRange = upperStop.pos - lowerStop.pos;
            const localT = segmentRange > 0 ? (t - lowerStop.pos) / segmentRange : 0;

            return {
                r: Math.floor(lowerStop.r + (upperStop.r - lowerStop.r) * localT),
                g: Math.floor(lowerStop.g + (upperStop.g - lowerStop.g) * localT),
                b: Math.floor(lowerStop.b + (upperStop.b - lowerStop.b) * localT)
            };
        }

        function renderNearRhymeWords(wordList) {
            if (wordList.length === 0) return '';

            // Calculate min and max similarity for dynamic color scaling
            const similarities = wordList.map(item => item.similarity);
            const minSim = Math.min(...similarities);
            const maxSim = Math.max(...similarities);

            // Group by exact similarity score
            const groupsBySimilarity = {};

            wordList.forEach(item => {
                if (!groupsBySimilarity[item.similarity]) {
                    groupsBySimilarity[item.similarity] = [];
                }
                groupsBySimilarity[item.similarity].push(item);
            });

            // Sort by similarity (descending)
            const sortedSimilarities = Object.keys(groupsBySimilarity).map(Number).sort((a, b) => b - a);

            let html = '';

            sortedSimilarities.forEach(similarity => {
                const items = groupsBySimilarity[similarity];

                const wordsHtml = items.map(item => {
                    const word = item.word;
                    const rank = wordRank[word] !== undefined ? wordRank[word] : 999999;

                    // Get heatmap color based on similarity with dynamic range
                    const color = getSimilarityColor(similarity, minSim, maxSim);

                    // Opacity based on frequency (more common = more opaque)
                    let opacity;
                    if (rank < 1000) opacity = 1.0;
                    else if (rank < 5000) opacity = 0.85;
                    else if (rank < 15000) opacity = 0.7;
                    else if (rank < 30000) opacity = 0.55;
                    else opacity = 0.4;

                    // Use color for border and text, keep background neutral
                    const colorRgba = `rgba(${color.r}, ${color.g}, ${color.b}, ${opacity})`;

                    // Determine level name
                    let levelName;
                    if (similarity >= 32) levelName = 'excellent';
                    else if (similarity >= 24) levelName = 'very good';
                    else if (similarity >= 16) levelName = 'good';
                    else if (similarity >= 12) levelName = 'moderate';
                    else if (similarity >= 8) levelName = 'fair';
                    else if (similarity >= 4) levelName = 'weak';
                    else levelName = 'poor';

                    const title = `${levelName} (similarity: ${similarity}, range: ${minSim}-${maxSim})`;

                    return `<div class="rhyme-word" style="background: transparent; color: ${colorRgba}; border-color: ${colorRgba};" title="${title}">${word}</div>`;
                }).join('');

                html += `<div style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px;">${wordsHtml}</div>`;
            });

            return html;
        }

        function displayRhymes() {
            const wordToFind = document.getElementById('word').value.toLowerCase().trim();
            if (!wordToFind) return;

            // Update URL with search parameter
            const url = new URL(window.location);
            url.searchParams.set('word', wordToFind);
            window.history.pushState({}, '', url);

            const rhymesList = getRhymes( wordToFind );
            const nearRhymesList = getNearRhymes( wordToFind );
            const resultsContainer = document.getElementById('results-container');
            const resultElement = document.getElementById('result');

            // Filter out the search word itself and alternate pronunciations (e.g., "word(2)")
            const filteredRhymes = rhymesList
                ? rhymesList.filter(word => word !== wordToFind && !/\(\d+\)$/.test(word))
                : [];
            // For near rhymes (objects with word and similarity), filter to only top 50k words
            const filteredNearRhymes = nearRhymesList.filter(item =>
                item.word !== wordToFind &&
                !/\(\d+\)$/.test(item.word) &&
                wordRank[item.word] !== undefined
            );

            // Sort perfect rhymes by word frequency
            const sortedRhymes = filteredRhymes.sort((a, b) => {
                const rankA = wordRank[a] !== undefined ? wordRank[a] : 999999;
                const rankB = wordRank[b] !== undefined ? wordRank[b] : 999999;
                return rankA - rankB;
            });

            // Near rhymes are already sorted by similarity from getNearRhymes()
            const sortedNearRhymes = filteredNearRhymes;

            let html = '';

            if (sortedRhymes.length > 0) {
                html += `
                    <div class="rhyme-section">
                        <h3>Perfect Rhymes</h3>
                        <div style="display: flex; flex-wrap: wrap; gap: 8px;">
                            ${renderRhymeWords(sortedRhymes)}
                        </div>
                    </div>
                `;
            }

            if (sortedNearRhymes.length > 0) {
                if (sortedRhymes.length > 0) {
                    html += '<div class="section-divider"></div>';
                }
                html += `
                    <div class="rhyme-section">
                        <h3>Near Rhymes</h3>
                        ${renderNearRhymeWords(sortedNearRhymes)}
                    </div>
                `;
            }

            if (html) {
                resultElement.innerHTML = html;
                resultsContainer.classList.add('show');
            } else {
                resultElement.innerHTML = '<p class="empty-state">No rhymes found. Try another word!</p>';
                resultsContainer.classList.add('show');
            }
        }

        // Load rhyme from URL parameter on page load
        function loadFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            const word = urlParams.get('word');
            if (word) {
                document.getElementById('word').value = word;
                displayRhymes();
            }
        }

        // Load from URL when page loads
        window.addEventListener('load', loadFromURL);

        // Register service worker for offline support
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(registration => {
                        console.log('ServiceWorker registered:', registration);
                    })
                    .catch(error => {
                        console.log('ServiceWorker registration failed:', error);
                    });
            });
        }
    </script>
</body>
