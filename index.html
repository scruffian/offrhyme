<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#667eea">
    <meta name="description" content="Find perfect rhymes for any word using phonetic matching">
    <link rel="manifest" href="/manifest.json">
    <title>Offrhyme - Find Perfect Rhymes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #fff;
        }

        .container {
            max-width: 900px;
            width: 100%;
            margin-top: 60px;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
            font-weight: 300;
        }

        .nav-links {
            margin-top: 20px;
        }

        .nav-links a {
            color: #fff;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .nav-links a:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .search-section {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
        }

        form {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 16px 20px;
            font-size: 1.1rem;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            outline: none;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input[type="text"]:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            padding: 16px 32px;
            font-size: 1.1rem;
            font-weight: 600;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .results {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            min-height: 200px;
            display: none;
        }

        .results.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .results h2 {
            color: #333;
            font-size: 1.5rem;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e0e0e0;
        }

        #result {
            color: #555;
            font-size: 1.1rem;
            line-height: 2;
            word-wrap: break-word;
        }

        .empty-state {
            text-align: center;
            color: #999;
            font-style: italic;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }

            .container {
                margin-top: 30px;
            }

            .search-section, .results {
                padding: 25px;
            }

            form {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Offrhyme</h1>
            <p class="subtitle">Find perfect rhymes for any word</p>
            <div class="nav-links">
                <a href="spoons.html">Try Spoonerizer →</a>
            </div>
        </header>

        <div class="search-section">
            <form onsubmit="displayRhymes(); return false;">
                <input
                    type="text"
                    id="word"
                    placeholder="Enter a word to find rhymes..."
                    autocomplete="off"
                    required
                />
                <button type="submit">Find Rhymes</button>
            </form>
        </div>

        <div class="results" id="results-container">
            <h2>Rhymes</h2>
            <div id="result"></div>
        </div>
    </div>

    <script src="words.js"></script>
    <script src="top-fifty.js"></script>
    <script>
        // Create a word rank lookup for fast sorting
        const wordRank = {};
        topFifty.forEach((word, index) => {
            wordRank[word] = index;
        });

        // Extract rhyming part from the last stressed vowel onwards
        function getRhymingPart( phoneticStr ) {
            if (!phoneticStr) return '';
            const phonemes = phoneticStr.split(' ');

            // Find the last phoneme with primary stress (ending in '1')
            let lastStressedIndex = -1;
            for (let i = phonemes.length - 1; i >= 0; i--) {
                if (phonemes[i].match(/1$/)) {
                    lastStressedIndex = i;
                    break;
                }
            }

            // If no primary stress found, fall back to old behavior
            if (lastStressedIndex === -1) {
                return phoneticStr.substring(phoneticStr.indexOf(" ") + 1, phoneticStr.length);
            }

            // Return everything from the last stressed vowel onwards
            return phonemes.slice(lastStressedIndex).join(' ');
        }

        const rhymes = {};
        Object.keys( words ).forEach( word => {
            const rhymingPart = getRhymingPart( words[ word ] );
            if ( ! rhymes[ rhymingPart ] ) {
                rhymes[ rhymingPart ] = [];
            }
            rhymes[ rhymingPart ].push( word );
        } );
        function getRhymes( word ) {
            const rhyme = getRhymingPart( words[ word ] );
            return rhymes[ rhyme ];
        }

        function displayRhymes() {
            const wordToFind = document.getElementById('word').value.toLowerCase();
            const rhymesList = getRhymes( wordToFind );
            const resultsContainer = document.getElementById('results-container');
            const resultElement = document.getElementById('result');

            if (rhymesList && rhymesList.length > 0) {
                // Filter out the search word itself from results
                const filteredRhymes = rhymesList.filter(word => word !== wordToFind);

                // Sort rhymes by word frequency (prioritize common words)
                const sortedRhymes = filteredRhymes.sort((a, b) => {
                    const rankA = wordRank[a] !== undefined ? wordRank[a] : 999999;
                    const rankB = wordRank[b] !== undefined ? wordRank[b] : 999999;
                    return rankA - rankB;
                });

                if (sortedRhymes.length > 0) {
                    resultElement.innerText = sortedRhymes.join(', ');
                    resultsContainer.classList.add('show');
                } else {
                    resultElement.innerHTML = '<p class="empty-state">No rhymes found. Try another word!</p>';
                    resultsContainer.classList.add('show');
                }
            } else {
                resultElement.innerHTML = '<p class="empty-state">No rhymes found. Try another word!</p>';
                resultsContainer.classList.add('show');
            }
        }

        // Register service worker for offline support
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(registration => {
                        console.log('ServiceWorker registered:', registration);
                    })
                    .catch(error => {
                        console.log('ServiceWorker registration failed:', error);
                    });
            });
        }
    </script>
</body>
</html>
