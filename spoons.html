<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="description" content="Create clever spoonerisms by swapping initial sounds of words">
    <link rel="manifest" href="manifest.json">
    <title>Spoonerizer - Offrhyme</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #fff;
        }

        .container {
            max-width: 900px;
            width: 100%;
            margin-top: 60px;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
            font-weight: 300;
        }

        .nav-links {
            margin-top: 20px;
        }

        .nav-links a {
            color: #fff;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .nav-links a:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .search-section {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
        }

        .info-box {
            background: rgba(102, 126, 234, 0.1);
            border-left: 4px solid #667eea;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            color: #555;
            font-size: 0.95rem;
        }

        form {
            display: flex;
            gap: 12px;
        }

        input[type="text"] {
            flex: 1;
            padding: 16px 20px;
            font-size: 1.1rem;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            outline: none;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input[type="text"]:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            padding: 16px 32px;
            font-size: 1.1rem;
            font-weight: 600;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            white-space: nowrap;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .results {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: none;
        }

        .results.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-row {
            margin-bottom: 30px;
        }

        .result-row:last-child {
            margin-bottom: 0;
        }

        .result-label {
            color: #999;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .result-text {
            color: #333;
            font-size: 2rem;
            font-weight: 600;
            line-height: 1.3;
        }

        .arrow {
            text-align: center;
            color: #667eea;
            font-size: 1.5rem;
            margin: 20px 0;
        }

        .empty-state {
            text-align: center;
            color: #999;
            font-style: italic;
            padding: 40px;
        }

        .install-prompt {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(102, 126, 234, 0.95);
            border-top: 2px solid #667eea;
            padding: 15px 20px;
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            z-index: 1000;
            box-shadow: 0 -4px 12px rgba(102, 126, 234, 0.3);
        }

        .install-prompt.show {
            display: flex;
        }

        .install-prompt-text {
            flex: 1;
            font-size: 0.9rem;
            color: #555;
        }

        .install-prompt-buttons {
            display: flex;
            gap: 10px;
        }

        .install-prompt button {
            padding: 10px 20px;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        .install-prompt .dismiss {
            background: transparent;
            border: 2px solid #ddd;
            color: #666;
        }

        .install-prompt .dismiss:hover {
            background: #f5f5f5;
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }

            .container {
                margin-top: 30px;
            }

            .search-section, .results {
                padding: 25px;
            }

            form {
                flex-direction: column;
            }

            button {
                width: 100%;
            }

            .result-text {
                font-size: 1.5rem;
            }

            .install-prompt {
                flex-direction: column;
                align-items: stretch;
            }

            .install-prompt-buttons {
                flex-direction: column;
            }

            .install-prompt button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="install-prompt" id="install-prompt">
        <div class="install-prompt-text">
            Add offrhyme to your home screen for quick access and offline use
        </div>
        <div class="install-prompt-buttons">
            <button id="install-button">Install</button>
            <button class="dismiss" id="dismiss-button">Dismiss</button>
        </div>
    </div>

    <div class="container">
        <header>
            <h1>Spoonerizer</h1>
            <p class="subtitle">Create clever spoonerisms from any word</p>
            <div class="nav-links">
                <a href="index.html">← Back to Rhyme Finder</a>
            </div>
        </header>

        <div class="search-section">
            <div class="info-box">
                A spoonerism swaps the initial sounds of words. Try "winter" to see "winter wind" become "winder wint"!
            </div>
            <form onsubmit="displaySpoonerisms( event ); return false;">
                <input
                    type="text"
                    id="word"
                    placeholder="Enter a word..."
                    autocomplete="off"
                    required
                />
                <button type="submit">Find Spoonerism</button>
            </form>
        </div>

        <div class="results" id="results-container">
            <div class="result-row">
                <div class="result-label">Original</div>
                <div class="result-text" id="input"></div>
            </div>
            <div class="arrow">↓</div>
            <div class="result-row">
                <div class="result-label">Spoonerism</div>
                <div class="result-text" id="result"></div>
            </div>
        </div>
    </div>

    <script src="words.js"></script>
    <script src="rhymes.js"></script>
    <script src="phoneticRhymes.js"></script>
    <script src="rhyme-table.js"></script>
    <script src="top-fifty.js"></script>
    <script src="wordFrequency.js"></script>
    <script>
        function removeFirstWordUsingSubString( input ) {
           return input.substring(input.indexOf(" ") + 1, input.length );
        }
        function findFirstWordUsingSubString( input ) {
           return input.substring( 0, input.indexOf(" ") );
        }
        function findLastTwoWords( input ) {
            const inputArray = input.split(' ');
            return inputArray[ inputArray.length - 2 ] + ' ' +[ inputArray.length - 1 ];
        }

        // Extract rhyming part from the last stressed vowel onwards
        function getRhymingPart( phoneticStr ) {
            if (!phoneticStr) return '';
            const phonemes = phoneticStr.split(' ');

            // Find the last phoneme with primary stress (ending in '1')
            let lastStressedIndex = -1;
            for (let i = phonemes.length - 1; i >= 0; i--) {
                if (phonemes[i].match(/1$/)) {
                    lastStressedIndex = i;
                    break;
                }
            }

            // If no primary stress found, fall back to old behavior
            if (lastStressedIndex === -1) {
                return phoneticStr.substring(phoneticStr.indexOf(" ") + 1, phoneticStr.length);
            }

            // Return everything from the last stressed vowel onwards
            return phonemes.slice(lastStressedIndex).join(' ');
        }

        // Return elements of array a that are also in b in linear time:
        function intersect(a, b) {
            return a.filter(Set.prototype.has, new Set(b));
        }
        function getRhymes( word ) {
            const rhyme = getRhymingPart( words[ word ] );
            return rhymes[ rhyme ];
        }

        function getSpoonerisms( word ) {
            const rhyme = removeFirstWordUsingSubString( words[ word ] );
            const firstLetter = findFirstWordUsingSubString( words[ word ] );
            const rhymesWithLetter = rhymeTable[firstLetter];

            const soundToUse = Object.keys(rhymeTable).find( firstSound => {
                if ( firstSound !== firstLetter && rhymeTable[ firstSound ].indexOf(rhyme) > -1 && intersect( rhymesWithLetter, rhymeTable[ firstSound ] ).length > 0 ) {
                    return firstSound
                }
            } );

            const rhymeToUse = soundToUse + ' ' + rhyme;
            const otherWord = Object.keys(words).find( word => {
                return words[ word ] === rhymeToUse;
            } );

            const intersectionOfTwoLetters = intersect( rhymesWithLetter, rhymeTable[ soundToUse ] );
            const phoneticMatch = phoneticRhymes[ intersectionOfTwoLetters[0] ].find( phoneticRhyme => findFirstWordUsingSubString( phoneticRhyme ) ===  soundToUse );
            const wordMatch = Object.keys(words).find( word => {
                return words[ word ] === phoneticMatch;
            } );
            const rhymePairPhonetic = firstLetter + " " + intersectionOfTwoLetters[0];
            const rhymePair = Object.keys(words).find( word => {
                return words[ word ] === rhymePairPhonetic;
            } );
            return [ wordMatch, otherWord, rhymePair ];
        }

        function displaySpoonerisms( event ) {
            if (event) event.preventDefault();

            const wordToFind = document.getElementById('word').value.toLowerCase().trim();
            if (!wordToFind) return false;

            // Update URL with search parameter
            const url = new URL(window.location);
            url.searchParams.set('word', wordToFind);
            window.history.pushState({}, '', url);

            const resultsContainer = document.getElementById('results-container');
            const inputElement = document.getElementById('input');
            const resultElement = document.getElementById('result');

            try {
                const spoonerisms = getSpoonerisms( wordToFind );
                if (spoonerisms && spoonerisms[0] && spoonerisms[1] && spoonerisms[2]) {
                    inputElement.innerText = wordToFind + " " + spoonerisms[0];
                    resultElement.innerText = spoonerisms[1] + " " + spoonerisms[2];
                    resultsContainer.classList.add('show');
                } else {
                    inputElement.innerHTML = '<p class="empty-state">No spoonerism found for this word. Try another!</p>';
                    resultElement.innerText = '';
                    resultsContainer.classList.add('show');
                }
            } catch (error) {
                inputElement.innerHTML = '<p class="empty-state">No spoonerism found for this word. Try another!</p>';
                resultElement.innerText = '';
                resultsContainer.classList.add('show');
            }
            return false;
        }

        // Load spoonerism from URL parameter on page load
        function loadFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            const word = urlParams.get('word');
            if (word) {
                document.getElementById('word').value = word;
                displaySpoonerisms(null);
            }
        }

        // Load from URL when page loads
        window.addEventListener('load', loadFromURL);

        // Register service worker for offline support
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .then(registration => {
                        console.log('ServiceWorker registered:', registration);
                    })
                    .catch(error => {
                        console.log('ServiceWorker registration failed:', error);
                    });
            });
        }

        // PWA install prompt
        let deferredPrompt;
        const installPrompt = document.getElementById('install-prompt');
        const installButton = document.getElementById('install-button');
        const dismissButton = document.getElementById('dismiss-button');

        window.addEventListener('beforeinstallprompt', (e) => {
            // Prevent the mini-infobar from appearing on mobile
            e.preventDefault();
            // Store the event so it can be triggered later
            deferredPrompt = e;

            // Check if user has previously dismissed
            const dismissed = localStorage.getItem('install-prompt-dismissed');
            if (!dismissed) {
                // Show the install prompt
                installPrompt.classList.add('show');
            }
        });

        installButton.addEventListener('click', async () => {
            if (!deferredPrompt) {
                return;
            }
            // Show the install prompt
            deferredPrompt.prompt();
            // Wait for the user's response
            const { outcome } = await deferredPrompt.userChoice;
            console.log(`User response: ${outcome}`);
            // Clear the deferredPrompt
            deferredPrompt = null;
            // Hide the install prompt
            installPrompt.classList.remove('show');
        });

        dismissButton.addEventListener('click', () => {
            // Hide the install prompt
            installPrompt.classList.remove('show');
            // Remember that user dismissed it
            localStorage.setItem('install-prompt-dismissed', 'true');
        });

        // Listen for successful installation
        window.addEventListener('appinstalled', () => {
            console.log('PWA was installed');
            installPrompt.classList.remove('show');
            deferredPrompt = null;
        });
    </script>
</body>
</html>
