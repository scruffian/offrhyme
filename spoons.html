<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="description" content="Create spoonerisms">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <link rel="stylesheet" href="styles.css">
    <title>Spoonerizer - Offrhyme</title>
</head>
<body>
    <div class="install-prompt" id="install-prompt">
        <div class="install-prompt-text">
            Add offrhyme to your home screen for quick access and offline use
        </div>
        <div class="install-prompt-buttons">
            <button id="install-button">Install</button>
            <button class="dismiss" id="dismiss-button">Dismiss</button>
        </div>
    </div>

    <div class="container">
        <header>
            <h1>Sp<img src="logo.svg" alt="o" class="logo-inline">onerizer</h1>
            <p class="subtitle">Speate Croonerisms</p>
        </header>
        <div class="search-section">
            <form onsubmit="displaySpoonerisms( event ); return false;">
                <label class="info-box" for="word">
                    Crearch to seate a loonerism spist.
                </label>

                <div class="form-row">
                    <div class="input-wrapper">
                        <input
                            type="text"
                            id="word"
                            name="word"
                            placeholder="Wenter an ord..."
                            autocomplete="off"
                            required
                        />
                    </div>
                    <button type="submit">Spind Foonerism</button>
                </div>
            </form>
        </div>

        <div class="results" id="results-container">
            <div id="input" style="display: none;"></div>
            <div id="result"></div>
        </div>
        <div class="nav-links">
            <a href="index.html">← Back to Rhyme Finder</a>
        </div>
    </div>

    <script src="words.js"></script>
    <script src="rhymes.js"></script>
    <script src="phoneticRhymes.js"></script>
    <script src="rhyme-table.js"></script>
    <script src="top-fifty.js"></script>
    <script src="wordFrequency.js"></script>
    <script>
        // Create word rank from topFifty for frequency-based sorting
        const wordRank = {};
        topFifty.forEach((word, index) => {
            wordRank[word] = index;
        });

        // Create reverse lookup: phonetic -> words (for O(1) lookups instead of O(n) filters)
        const phoneticToWords = {};
        Object.keys(words).forEach(word => {
            const phonetic = words[word];
            if (!phoneticToWords[phonetic]) {
                phoneticToWords[phonetic] = [];
            }
            phoneticToWords[phonetic].push(word);
        });

        // Sort each phonetic group by frequency (pre-sorted so we can just take [0])
        Object.keys(phoneticToWords).forEach(phonetic => {
            phoneticToWords[phonetic].sort((a, b) => {
                const rankA = wordRank[a] !== undefined ? wordRank[a] : 999999;
                const rankB = wordRank[b] !== undefined ? wordRank[b] : 999999;
                return rankA - rankB;
            });
        });

        function removeFirstWordUsingSubString( input ) {
           return input.substring(input.indexOf(" ") + 1, input.length );
        }
        function findFirstWordUsingSubString( input ) {
           return input.substring( 0, input.indexOf(" ") );
        }
        function findLastTwoWords( input ) {
            const inputArray = input.split(' ');
            return inputArray[ inputArray.length - 2 ] + ' ' +[ inputArray.length - 1 ];
        }

        // Extract rhyming part from the last stressed vowel onwards
        function getRhymingPart( phoneticStr ) {
            if (!phoneticStr) return '';
            const phonemes = phoneticStr.split(' ');

            // Find the last phoneme with primary stress (ending in '1')
            let lastStressedIndex = -1;
            for (let i = phonemes.length - 1; i >= 0; i--) {
                if (phonemes[i].match(/1$/)) {
                    lastStressedIndex = i;
                    break;
                }
            }

            // If no primary stress found, fall back to old behavior
            if (lastStressedIndex === -1) {
                return phoneticStr.substring(phoneticStr.indexOf(" ") + 1, phoneticStr.length);
            }

            // Return everything from the last stressed vowel onwards
            return phonemes.slice(lastStressedIndex).join(' ');
        }

        // Return elements of array a that are also in b in linear time:
        function intersect(a, b) {
            return a.filter(Set.prototype.has, new Set(b));
        }
        function getRhymes( word ) {
            const rhyme = getRhymingPart( words[ word ] );
            return rhymes[ rhyme ];
        }

        async function getSpoonerisms( word, onFound ) {
            const rhyme = removeFirstWordUsingSubString( words[ word ] );
            const firstLetter = findFirstWordUsingSubString( words[ word ] );
            const rhymesWithLetter = rhymeTable[firstLetter];

            if (!rhyme || !firstLetter || !rhymesWithLetter) {
                return [];
            }

            const allSpoonerisms = [];
            const seenSpoonerisms = new Set(); // Track unique spoonerisms
            const sounds = Object.keys(rhymeTable);
            let processedCount = 0;

            // Find ALL matching sounds
            for (const soundToUse of sounds) {
                if ( soundToUse !== firstLetter && rhymeTable[ soundToUse ].indexOf(rhyme) > -1 && intersect( rhymesWithLetter, rhymeTable[ soundToUse ] ).length > 0 ) {
                    const rhymeToUse = soundToUse + ' ' + rhyme;

                    // Fast lookup using pre-built index (already sorted by frequency)
                    const otherWordCandidates = phoneticToWords[rhymeToUse];
                    if (!otherWordCandidates || otherWordCandidates.length === 0) continue;

                    const otherWord = otherWordCandidates[0]; // Already sorted, take most common

                    const intersectionOfTwoLetters = intersect( rhymesWithLetter, rhymeTable[ soundToUse ] );
                    if (intersectionOfTwoLetters.length === 0) continue;

                    // Check ALL intersections, not just the first one
                    for (const intersection of intersectionOfTwoLetters) {
                        if (!phoneticRhymes[ intersection ]) continue;

                        const phoneticMatch = phoneticRhymes[ intersection ].find( phoneticRhyme => findFirstWordUsingSubString( phoneticRhyme ) === soundToUse );
                        if (!phoneticMatch) continue;

                        // Fast lookup using pre-built index
                        const wordMatchCandidates = phoneticToWords[phoneticMatch];
                        if (!wordMatchCandidates || wordMatchCandidates.length === 0) continue;

                        const wordMatch = wordMatchCandidates[0]; // Already sorted, take most common

                        const rhymePairPhonetic = firstLetter + " " + intersection;
                        // Fast lookup using pre-built index
                        const rhymePairCandidates = phoneticToWords[rhymePairPhonetic];
                        if (!rhymePairCandidates || rhymePairCandidates.length === 0) continue;

                        const rhymePair = rhymePairCandidates[0]; // Already sorted, take most common

                        // Create unique key to detect duplicates
                        const spoonKey = `${wordMatch}|${otherWord}|${rhymePair}`;

                        // Skip if we've already seen this exact spoonerism
                        if (seenSpoonerisms.has(spoonKey)) continue;
                        seenSpoonerisms.add(spoonKey);

                        const spoon = { wordMatch, otherWord, rhymePair };
                        allSpoonerisms.push(spoon);

                        // Call callback with new result
                        if (onFound) {
                            onFound(spoon);
                        }
                    }
                }

                // Yield to browser every 5 sounds to keep UI responsive
                processedCount++;
                if (processedCount % 5 === 0) {
                    await new Promise(resolve => setTimeout(resolve, 0));
                }
            }

            // Sort by combined word frequency (lower rank = more common)
            allSpoonerisms.sort((a, b) => {
                const scoreA = (wordRank[a.wordMatch] || 999999) + (wordRank[a.otherWord] || 999999) + (wordRank[a.rhymePair] || 999999);
                const scoreB = (wordRank[b.wordMatch] || 999999) + (wordRank[b.otherWord] || 999999) + (wordRank[b.rhymePair] || 999999);
                return scoreA - scoreB;
            });

            return allSpoonerisms;
        }

        function renderSpoonerism(wordToFind, spoon) {
            return `
                <div class="spoonerism-item">
                    <span class="original-phrase">${wordToFind} ${spoon.wordMatch}</span>
                    <span class="arrow">→</span>
                    <span class="spoonerism-phrase">${spoon.otherWord} ${spoon.rhymePair}</span>
                </div>
            `;
        }

        async function displaySpoonerisms( event ) {
            if (event) event.preventDefault();

            const wordToFind = document.getElementById('word').value.toLowerCase().trim();
            if (!wordToFind) return false;

            // Update URL with search parameter
            const url = new URL(window.location);
            url.searchParams.set('word', wordToFind);
            window.history.pushState({}, '', url);

            const resultsContainer = document.getElementById('results-container');
            const inputElement = document.getElementById('input');
            const resultElement = document.getElementById('result');

            // Show loading state
            inputElement.style.display = 'none';
            resultElement.innerHTML = '<p class="empty-state">Finding spoonerisms...</p>';
            resultsContainer.classList.add('show');

            // Yield to browser to show loading state
            await new Promise(resolve => setTimeout(resolve, 0));

            const allSpoonerisms = [];
            let displayedCount = 0;

            try {
                // Stream results as they're found
                const sortedSpoonerisms = await getSpoonerisms(wordToFind, (spoon) => {
                    allSpoonerisms.push(spoon);

                    // Update display with new result
                    if (displayedCount === 0) {
                        resultElement.innerHTML = '<div class="spoonerisms-list"></div>';
                    }
                    const listElement = resultElement.querySelector('.spoonerisms-list');
                    listElement.innerHTML += renderSpoonerism(wordToFind, spoon);
                    displayedCount++;
                });

                // Re-render with sorted results
                if (sortedSpoonerisms.length > 0) {
                    let cardsHtml = '';
                    sortedSpoonerisms.forEach((spoon) => {
                        cardsHtml += renderSpoonerism(wordToFind, spoon);
                    });
                    resultElement.innerHTML = `<div class="spoonerisms-list">${cardsHtml}</div>`;
                } else if (allSpoonerisms.length === 0) {
                    inputElement.innerHTML = '<p class="empty-state">No spoonerism found for this word. Try another!</p>';
                    inputElement.style.display = 'block';
                    resultElement.innerText = '';
                }
            } catch (error) {
                console.error(error);
                inputElement.innerHTML = '<p class="empty-state">No spoonerism found for this word. Try another!</p>';
                inputElement.style.display = 'block';
                resultElement.innerText = '';
            }
            return false;
        }

        // Load spoonerism from URL parameter on page load
        function loadFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            const word = urlParams.get('word');
            if (word) {
                document.getElementById('word').value = word;
                displaySpoonerisms(null);
            }
        }

        // Load from URL when page loads
        window.addEventListener('load', loadFromURL);

        // Register service worker for offline support
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .then(registration => {
                        console.log('ServiceWorker registered:', registration);
                    })
                    .catch(error => {
                        console.log('ServiceWorker registration failed:', error);
                    });
            });
        }

        // PWA install prompt
        let deferredPrompt;
        const installPrompt = document.getElementById('install-prompt');
        const installButton = document.getElementById('install-button');
        const dismissButton = document.getElementById('dismiss-button');

        window.addEventListener('beforeinstallprompt', (e) => {
            // Prevent the mini-infobar from appearing on mobile
            e.preventDefault();
            // Store the event so it can be triggered later
            deferredPrompt = e;

            // Check if user has previously dismissed
            const dismissed = localStorage.getItem('install-prompt-dismissed');
            if (!dismissed) {
                // Show the install prompt
                installPrompt.classList.add('show');
            }
        });

        installButton.addEventListener('click', async () => {
            if (!deferredPrompt) {
                return;
            }
            // Show the install prompt
            deferredPrompt.prompt();
            // Wait for the user's response
            const { outcome } = await deferredPrompt.userChoice;
            console.log(`User response: ${outcome}`);
            // Clear the deferredPrompt
            deferredPrompt = null;
            // Hide the install prompt
            installPrompt.classList.remove('show');
        });

        dismissButton.addEventListener('click', () => {
            // Hide the install prompt
            installPrompt.classList.remove('show');
            // Remember that user dismissed it
            localStorage.setItem('install-prompt-dismissed', 'true');
        });

        // Listen for successful installation
        window.addEventListener('appinstalled', () => {
            console.log('PWA was installed');
            installPrompt.classList.remove('show');
            deferredPrompt = null;
        });
    </script>
</body>
</html>
